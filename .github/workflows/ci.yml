# ===========================
# DevFlow — CI/CD Pipeline
# .github/workflows/ci.yml
# ===========================
#
# This workflow runs on every push to main and on every pull request.
# Stages: Lint → Test → Build → Deploy (deploy only on main)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ----------------------------
  # STAGE 1: Lint
  # Checks code quality with ESLint.
  # If this fails, the rest of the pipeline won't run.
  # ----------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ----------------------------
  # STAGE 2: Test
  # Runs the test suite in tests/app.test.js.
  # Only runs if lint passed (needs: lint).
  # ----------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ----------------------------
  # STAGE 3: Build
  # Copies files into /dist (simulates a build step).
  # Only runs if tests passed (needs: test).
  # ----------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Save the dist folder so the deploy job can use it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ----------------------------
  # STAGE 4: Deploy
  # Downloads the build artifact and deploys to the test environment.
  # Only runs on pushes to main (not on PRs).
  # Replace the echo commands with your real deploy step.
  # ----------------------------
  deploy:
    name: Deploy to Test Env
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy
        run: |
          echo "🚀 Deploying to test environment..."
          echo "Files ready in dist/:"
          ls -la dist/
          echo "✅ Deployment complete!"
          # --- Replace above with your real deploy command, e.g.: ---
          # rsync -avz dist/ user@your-server:/var/www/html/
          # OR use a service-specific action like:
          # uses: netlify/actions/cli@master
          # uses: nwtgck/actions-netlify@v2
          # uses: appleboy/scp-action@master (for SSH/SCP)
